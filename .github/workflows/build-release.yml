
name: Build and publish Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller numpy matplotlib pyserial pyvisa

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --clean `
            --noconfirm `
            --onefile `
            --hidden-import=serial `
            --name cfd_instrument_control `
            --distpath release/build_env/dist `
            --workpath release/build_env/build `
            --specpath release/build_env `
            main.py

      - name: Calculate next version
        id: version
        shell: pwsh
        run: |
          $tags = git tag --list "v1.*" |
            Where-Object { $_ -match '^v1\.\d+$' } |
            ForEach-Object { [int]($_ -replace '^v1\.', '') }

          if ($tags.Count -eq 0) {
            $next = 4
          } else {
            $next = ($tags | Measure-Object -Maximum).Maximum + 1
          }

          $version = "v1.$next"
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Next version: $version"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: CFD Instrument Control ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: release/build_env/dist/cfd_instrument_control.exe
